<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 400"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">ExecuVision Studio</title>
  <desc id="desc">
    A cyan, magenta, black, and white title card inspired by the original graphics-library title
    screens. Create. Prepare. Present.
  </desc>

  <!-- Studio title artwork in editable vectors. The medallion follows the
       supplied historical reference; the rest adapts its layout for Studio.
       The 640 x 400 composition keeps the original 8:5 screen proportions. -->
  <rect width="640" height="400" fill="#55ffff" />
  <g shape-rendering="crispEdges">
    <!-- The center rule continues behind the medallion, title, and caption. -->
    <path d="M313 0h14v400h-14z" fill="#ff55ff" />
    <path d="M315 0h10v400h-10z" fill="#fff" />
    <path d="M317 0h6v400h-6z" fill="#000" />

    <!-- The interwoven EV follows the supplied crest's 37 x 29 pixel grid.
         Two SVG units per original pixel retain the small curls and the fine
         oval steps at the title card's scale. Paths remain editable; no embedded
         bitmap or external font is used for this mark. -->
    <g id="ev-medallion" transform="translate(283 8) scale(2)">
      <path
        d="M12 0H25V1H27V2H29V3H31V4H32V5H33V6H34V7H35V8H36V10H37V19H36V21H35V22H34V23H33V24H32V25H31V26H29V27H27V28H25V29H12V28H10V27H8V26H6V25H5V24H4V23H3V22H2V21H1V19H0V10H1V8H2V7H3V6H4V5H5V4H6V3H8V2H10V1H12V0Z"
        fill="#000"
      />
      <path
        d="M13 1H24V2H27V3H29V4H30V5H31V6H32V7H33V8H34V9H35V11H36V18H35V20H34V21H33V22H32V23H31V24H30V25H29V26H27V27H25V28H12V27H10V26H8V25H7V24H6V23H5V22H4V21H3V20H2V18H1V11H2V9H3V8H4V7H5V6H6V5H7V4H8V3H10V2H13V1Z"
        fill="#fff"
      />
      <!-- Each subpath is a horizontal ink run, ordered from top to bottom. -->
      <path
        fill="#ff55ff"
        d="
        M14 3h2v1h-2z
        M11 4h7v1h-7z M19 4h2v1h-2z
        M10 5h2v1h-2z M16 5h4v1h-4z
        M10 6h1v1h-1z M17 6h2v1h-2z
        M10 7h1v1h-1z M17 7h1v1h-1z
        M10 8h2v1h-2z
        M11 9h3v1h-3z M16 9h1v1h-1z
        M8 10h8v1h-8z
        M6 11h2v1h-2z M13 11h1v1h-1z
        M5 12h2v1h-2z M16 12h1v1h-1z M25 12h7v1h-7z
        M5 13h1v1h-1z M14 13h3v1h-3z M26 13h2v1h-2z
        M4 14h2v1h-2z M12 14h6v1h-6z M26 14h2v1h-2z
        M4 15h2v1h-2z M15 15h3v1h-3z M26 15h2v1h-2z
        M4 16h2v1h-2z M16 16h2v1h-2z M25 16h2v1h-2z
        M4 17h3v1h-3z M17 17h2v1h-2z M25 17h2v1h-2z
        M5 18h2v1h-2z M17 18h2v1h-2z M24 18h2v1h-2z M30 18h1v1h-1z
        M5 19h3v1h-3z M18 19h2v1h-2z M23 19h2v1h-2z M29 19h3v1h-3z
        M6 20h3v1h-3z M18 20h2v1h-2z M23 20h2v1h-2z M30 20h1v1h-1z
        M7 21h3v1h-3z M17 21h4v1h-4z M22 21h2v1h-2z
        M8 22h4v1h-4z M16 22h1v1h-1z M20 22h1v1h-1z M22 22h1v1h-1z
        M10 23h6v1h-6z M20 23h3v1h-3z
        M21 24h1v1h-1z
        M21 25h1v1h-1z
        "
      />
    </g>

    <!-- White wordmark field, edged in the four-color CGA palette. -->
    <path d="M0 78h640v165H0z" fill="#ff55ff" />
    <path d="M0 80h640v161H0z" fill="#fff" />
    <path d="M0 83h640v3H0z" fill="#000" />
  </g>

  <!-- Fixed text lengths keep the wordmark aligned across local serif fonts. -->
  <g fill="#000" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="50">
    <text x="83" y="177" textLength="209" lengthAdjust="spacingAndGlyphs">EXECU</text>
    <text x="365" y="177" textLength="192" lengthAdjust="spacingAndGlyphs">ISION</text>
  </g>
  <!-- Oversized V: black serifs and shadow, a white inset, and magenta face. -->
  <g shape-rendering="crispEdges">
    <path d="M278 99h36v3h-8l32 76 32-76h-9v-3h27v3h-9l-42 96h-4l-42-96h-13z" fill="#000" />
    <path d="M293 99h16v3h-6l34 80 34-80h-6v-3h13l-42 93z" fill="#fff" />
    <path d="M296 99h14v3h-6l33 77 33-77h-6v-3h10l-38 88z" fill="#ff55ff" />
  </g>
  <text
    x="379"
    y="126"
    fill="#000"
    font-family="'Courier New', monospace"
    font-size="17"
    letter-spacing="4"
  >
    EST. 1983
  </text>
  <text
    x="320"
    y="225"
    text-anchor="middle"
    fill="#000"
    font-family="'Courier New', monospace"
    font-size="27"
    font-weight="bold"
    letter-spacing="12"
  >
    STUDIO
  </text>

  <!-- Framed collection-label motif, adapted to the editor's three tasks. -->
  <g shape-rendering="crispEdges">
    <path d="M111 271h418v62H111z" fill="#fff" />
    <path d="M114 274h412v56H114z" fill="#ff55ff" />
    <path d="M116 276h408v52H116z" fill="#000" />
    <path d="M119 279h402v46H119z" fill="none" stroke="#fff" stroke-width="1" />
    <path d="M44 258h2v12h-2zm-5 5h12v2h-12zm557 79h2v16h-2zm-7 7h16v2h-16z" fill="#fff" />
  </g>
  <g fill="#55ffff" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold">
    <text x="320" y="299" font-size="20" letter-spacing="2">CREATE. PREPARE. PRESENT.</text>
    <text x="320" y="318" font-size="12" letter-spacing="2">
      YOUR NEXT BIG IDEA, IN FOUR COLORS.
    </text>
  </g>

  <!-- Contemporary attribution replaces the historical publisher/copyright line. -->
  <g shape-rendering="crispEdges">
    <path d="M0 357h640v27H0z" fill="#ff55ff" />
    <path d="M2 359h636v23H2z" fill="#fff" />
    <path d="M0 384h640v16H0z" fill="#000" />
  </g>
  <text
    x="320"
    y="377"
    text-anchor="middle"
    fill="#ff55ff"
    font-family="'Courier New', monospace"
    font-size="18"
    font-weight="bold"
    letter-spacing="3"
  >
    PRESENTATION GRAPHICS, REIMAGINED.
  </text>
  <text
    x="320"
    y="396"
    text-anchor="middle"
    fill="#fff"
    font-family="'Courier New', monospace"
    font-size="9"
    letter-spacing="1"
  >
    EXECUVISION STUDIO · AN INDEPENDENT RECONSTRUCTION · 2026
  </text>
</svg>
